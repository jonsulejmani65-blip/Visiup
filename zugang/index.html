<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zugangsdaten – Visiup</title>
<style>
  :root{
    --teal:#0F766E; --teal-light:#7fd6cd; --teal-bg:#e9f6f4;
    --navy:#0D1B3D; --text:#1d2433; --muted:#64708a; --line:#e3e7ee;
    --bg:#f5f7fa; --card:#fff; --warn:#b45309; --warn-bg:#fff7ed;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header{background:var(--navy);color:#fff;padding:28px 16px 70px}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .logo{font-size:28px;font-weight:800;letter-spacing:-.5px}
  .logo span{color:var(--teal-light)}
  .slogan{opacity:.75;font-size:14px;margin-top:2px}
  header h1{font-size:26px;margin:26px 0 8px}
  header p{margin:0;opacity:.85;max-width:620px}
  .lang{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;flex-shrink:0}
  .lang button{border:0;background:none;color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;opacity:.75}
  .lang button.active{background:#fff;color:var(--navy);opacity:1}
  .lang.light{background:var(--bg);border:1px solid var(--line)}
  .lang.light button{color:var(--navy)}
  .lang.light button.active{background:var(--teal);color:#fff}
  main{margin-top:-44px;padding-bottom:120px}
  .card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(13,27,61,.06);padding:22px;margin-bottom:16px;border:1px solid var(--line)}
  .card h2{font-size:18px;margin:0 0 4px;color:var(--navy);display:flex;align-items:center;gap:10px}
  .card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .icon{width:34px;height:34px;border-radius:9px;background:var(--teal-bg);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:4px}
  input[type=text],input[type=email],input[type=tel],input[type=url],input[type=password],textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fbfcfd;color:var(--text)}
  input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.12);background:#fff}
  textarea{min-height:64px;resize:vertical}
  .pw{position:relative}
  .pw input{padding-right:84px}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--teal);font-weight:600;font-size:13px;cursor:pointer;padding:6px}
  .status{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .status label{margin:0;font-weight:500;font-size:13px;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:#fbfcfd;user-select:none}
  .status input{display:none}
  .status label:has(input:checked){background:var(--teal);border-color:var(--teal);color:#fff}
  .fields{display:none}
  .fields.show{display:block}
  .hint{background:var(--teal-bg);color:#0b4f4a;font-size:13px;border-radius:9px;padding:10px 12px;margin-bottom:12px}
  .done-badge{margin-left:auto;font-size:12px;font-weight:600;color:var(--teal);display:none}
  .card.done .done-badge{display:inline}
  .remove{margin-left:auto;border:0;background:none;color:#b91c1c;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{border:1px dashed var(--teal);color:var(--teal);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;font-family:inherit}
  .chip:hover{background:var(--teal-bg)}
  .chip[disabled]{opacity:.35;cursor:default}
  .btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:#0c5f58}
  .btn-primary:disabled{background:#9fb7b4;cursor:not-allowed}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .security{background:var(--warn-bg);border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:16px}
  .security b{color:var(--warn)}
  .consent-ok{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--teal);font-weight:600;margin-top:12px}
  .progress{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;z-index:10;box-shadow:0 -4px 14px rgba(13,27,61,.06)}
  .progress .wrap{display:flex;align-items:center;gap:14px}
  .bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar div{height:100%;background:var(--teal);width:0;transition:width .3s}
  .ptext{font-size:13px;color:var(--muted);white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
  .modal-bg{position:fixed;inset:0;background:rgba(13,27,61,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px}
  .modal h3{margin:0 0 6px;color:var(--navy);font-size:19px}
  /* Fehler */
  .invalid{border-color:#dc2626!important;background:#fef2f2!important;box-shadow:0 0 0 3px rgba(220,38,38,.15)!important}
  .err-msg{color:#dc2626;font-size:13px;font-weight:600;margin-top:5px}
  .err-banner{display:none;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:14px}
  .err-banner.show{display:block}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shake .3s 2}
  /* Einstiegs-Seite */
  .gate{position:fixed;inset:0;z-index:50;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
  .gate.hide{display:none}
  .gate-card{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .gate-card .top{margin-bottom:18px}
  .gate-card .logo{color:var(--navy);font-size:26px}
  .gate-card .logo span{color:var(--teal)}
  .gate-card h2{color:var(--navy);font-size:22px;margin:0 0 8px}
  .gate-card p{color:var(--muted);font-size:15px;margin:0 0 16px}
  .gate-list{margin:0 0 18px;padding:0;list-style:none;font-size:14px}
  .gate-list li{display:flex;gap:10px;margin-bottom:8px}
  .agree{display:flex;gap:12px;align-items:flex-start;background:var(--teal-bg);border:2px solid transparent;border-radius:12px;padding:14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);margin:0 0 16px}
  .agree input{width:22px;height:22px;accent-color:var(--teal);flex-shrink:0;margin-top:1px;cursor:pointer}
  .agree:has(input:checked){border-color:var(--teal)}
  .gate-card .btn{width:100%;font-size:16px;padding:14px}
  @media (max-width:600px){.grid{grid-template-columns:1fr}header h1{font-size:22px}.card{padding:18px}.gate-card{padding:22px}}
</style>
</head>
<body>

<!-- ===== Einstiegs-Seite: Einverständnis ===== -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="top">
      <div class="logo">Visi<span>up</span></div>
      <div class="lang light" data-langswitch></div>
    </div>
    <h2 data-t="gateTitle"></h2>
    <p data-t="gateText"></p>
    <ul class="gate-list">
      <li>🔒 <span data-t="gateP1"></span></li>
      <li>👤 <span data-t="gateP2"></span></li>
      <li>⏱️ <span data-t="gateP3"></span></li>
    </ul>
    <label class="agree"><input type="checkbox" id="agree"> <span data-t="gateAgree"></span></label>
    <button class="btn btn-primary" id="gateBtn" type="button" disabled onclick="acceptGate()" data-t="gateBtn"></button>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="logo">Visi<span>up</span></div>
        <div class="slogan" data-t="slogan"></div>
      </div>
      <div class="lang" data-langswitch></div>
    </div>
    <h1 data-t="h1"></h1>
    <p data-t="intro"></p>
  </div>
</header>

<main class="wrap">

  <div class="card">
    <h2><span class="icon">🏢</span><span data-t="youTitle"></span></h2>
    <p class="sub" data-t="youSub"></p>
    <div class="grid">
      <div><label data-t="fFirma"></label><input type="text" id="firma" data-key="firma"></div>
      <div><label data-t="fPerson"></label><input type="text" id="person" data-key="person"></div>
      <div><label data-t="fEmail"></label><input type="email" data-key="email"></div>
      <div><label data-t="fTel"></label><input type="tel" data-key="telefon"></div>
      <div class="full"><label data-t="fWeb"></label><input type="url" data-key="website" data-tp="fWebPh"></div>
    </div>
  </div>

  <div class="security" data-t="secTip"></div>

  <div id="platforms"></div>

  <div class="card">
    <h2><span class="icon">➕</span><span data-t="moreTitle"></span></h2>
    <p class="sub" data-t="moreSub"></p>
    <div class="chips" id="chips"></div>
    <button class="btn btn-ghost" type="button" onclick="addCustom()" data-t="addCustom"></button>
  </div>

  <div class="card">
    <h2><span class="icon">✅</span><span data-t="endTitle"></span></h2>
    <label data-t="fNotes"></label><textarea data-key="bemerkungen" data-tp="fNotesPh"></textarea>
    <div class="consent-ok">✓ <span data-t="consentOk"></span></div>
    <div class="err-banner" id="errBanner"></div>
    <div class="btn-row">
      <button class="btn btn-primary" type="button" id="sendBtn" onclick="submitForm()" data-t="send"></button>
      <input type="text" id="website_hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    </div>
    <p class="sub" style="margin-top:12px" data-t="sendNote"></p>
  </div>

  <footer data-t="footer"></footer>
</main>

<div class="progress"><div class="wrap"><div class="bar"><div id="barFill"></div></div><div class="ptext" id="ptext"></div></div></div>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="doneModal">
  <div class="modal" style="text-align:center;padding:34px 24px">
    <div style="font-size:46px">✅</div>
    <h3 style="font-size:22px;margin:8px 0" data-t="doneTitle"></h3>
    <p class="sub" style="font-size:15px;color:var(--muted)" data-t="doneText"></p>
    <p style="color:var(--teal);font-weight:600;margin:0" data-t="doneSign"></p>
  </div>
</div>

  {id:"analytics", icon:"📊", de:{name:"Google Analytics",invite:"Verwaltung → Kontozugriff → «+» → unsere E-Mail als Administrator hinzufügen."}, en:{name:"Google Analytics",invite:"Admin → Account access → «+» → add our email as administrator."}},
  {id:"searchconsole", icon:"🔎", de:{name:"Google Search Console",invite:"Einstellungen → Nutzer und Berechtigungen → Nutzer hinzufügen (Inhaber)."}, en:{name:"Google Search Console",invite:"Settings → Users and permissions → Add user (owner)."}},
  {id:"googleads", icon:"📢", de:{name:"Google Ads",invite:"Verwaltung → Zugriff und Sicherheit → «+» → unsere E-Mail hinzufügen."}, en:{name:"Google Ads",invite:"Admin → Access and security → «+» → add our email."}},
  {id:"tagmanager", icon:"🏷️", de:{name:"Google Tag Manager",invite:"Verwaltung → Nutzerverwaltung → «+» → Nutzer hinzufügen."}, en:{name:"Google Tag Manager",invite:"Admin → User management → «+» → add user."}},
  {id:"youtube", icon:"▶️", de:{name:"YouTube"}, en:{name:"YouTube"}},
  {id:"x", icon:"✖️", de:{name:"X (Twitter)"}, en:{name:"X (Twitter)"}},
  {id:"pinterest", icon:"📌", de:{name:"Pinterest"}, en:{name:"Pinterest"}},
  {id:"newsletter", icon:"✉️", extra:[{k:"tool",de:"Tool",en:"Tool",ph:"Mailchimp, Brevo …"}], de:{name:"Newsletter-Tool"}, en:{name:"Newsletter tool"}},
  {id:"shop", icon:"🛒", extra:[{k:"system",de:"System",en:"System",ph:"Shopify, WooCommerce …"}], de:{name:"Online-Shop"}, en:{name:"Online shop"}},
  {id:"localsearch", icon:"📒", de:{name:"local.ch / search.ch"}, en:{name:"local.ch / search.ch"}},
  {id:"bewertungen", icon:"⭐", extra:[{k:"portal",de:"Portal",en:"Platform",ph:"Trustpilot, Tripadvisor …"}], de:{name:"Bewertungsportale"}, en:{name:"Review platforms"}},
  {id:"mail", icon:"📨", extra:[{k:"anbieter",de:"Anbieter",en:"Provider",ph:"Microsoft 365, Gmail …"}], de:{name:"E-Mail-Postfach"}, en:{name:"Email inbox"}}
];

const STORE="visiup_zugangsdaten_v2";
let LANG="de", consentAt=null;
let extras=[];   // hinzugefügte optionale/eigene Zugänge (IDs)
const container=document.getElementById("platforms");
const t=k=>T[LANG][k];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const findP=id=>CORE.find(p=>p.id===id)||OPTIONAL.find(p=>p.id===id)||{id,icon:"🔑",custom:true,de:{name:T.de.custom},en:{name:T.en.custom}};

// ---------- Karten ----------
function cardHTML(p,removable){
  const L=p[LANG]; const inv=L.invite;
  const extra=(p.extra||[]).map(e=>`<div><label data-l="${esc(e.de)}">${esc(e[LANG])}</label><input type="text" data-key="${p.id}.${e.k}" placeholder="${esc(e.ph)}"></div>`).join("");
  const nameField=p.custom?`<div class="full"><label data-l="${esc(T.de.lPlat)}">${t("lPlat")}</label><input type="text" data-key="${p.id}.plattform" placeholder="${t("lPlatPh")}"></div>`:"";
  return `
  <div class="card" data-platform="${p.id}">
    <h2><span class="icon">${p.icon}</span><span class="pname">${esc(L.name)}</span><span class="done-badge">${t("done")}</span>${removable?`<button class="remove" type="button" onclick="removeCard('${p.id}')">${t("remove")}</button>`:""}</h2>
    ${L.sub?`<p class="sub">${esc(L.sub)}</p>`:""}
    <div class="status">
      <label><input type="radio" name="${p.id}.status" value="login" data-key="${p.id}.status"><span>${t("stLogin")}</span></label>
      ${inv?`<label><input type="radio" name="${p.id}.status" value="einladung" data-key="${p.id}.status"><span>${t("stInvite")}</span></label>`:""}
      <label><input type="radio" name="${p.id}.status" value="unbekannt" data-key="${p.id}.status"><span>${t("stUnknown")}</span></label>
      <label><input type="radio" name="${p.id}.status" value="keins" data-key="${p.id}.status"><span>${t("stNone")}</span></label>
    </div>
    <div class="fields" data-for="login"><div class="grid">
      ${nameField}
      <div class="full"><label data-l="${esc(T.de.lUrl)}">${t("lUrl")}</label><input type="text" data-key="${p.id}.url" placeholder="${t("lUrlPh")}"></div>
      <div><label data-l="${esc(T.de.lUser)}">${t("lUser")}</label><input type="text" data-key="${p.id}.user" autocomplete="off"></div>
      <div><label data-l="${esc(T.de.lPass)}">${t("lPass")}</label><div class="pw"><input type="password" data-key="${p.id}.pass" autocomplete="new-password"><button type="button" onclick="togglePw(this)">${t("show")}</button></div></div>
      ${extra}
      <div class="full"><label data-l="${esc(T.de.l2fa)}">${t("l2fa")}</label><input type="text" data-key="${p.id}.twofa" placeholder="${t("l2faPh")}"></div>
      <div class="full"><label data-l="${esc(T.de.lNote)}">${t("lNote")}</label><textarea data-key="${p.id}.notiz"></textarea></div>
    </div></div>
    <div class="fields" data-for="einladung">
      ${inv?`<div class="hint"><b>${t("howto")}</b> ${esc(inv)}<br>${t("ourMail")} <b>${esc(AGENTUR_EMAIL)}</b></div>`:""}
      <label data-l="${esc(T.de.lInvNote)}">${t("lInvNote")}</label><textarea data-key="${p.id}.notiz_einl" placeholder="${t("lInvNotePh")}"></textarea>
    </div>
    <div class="fields" data-for="unbekannt">
      <label data-l="${esc(T.de.lUnk)}">${t("lUnk")}</label><textarea data-key="${p.id}.notiz_unb"></textarea>
    </div>
  </div>`;
}
function renderCards(data){
  container.innerHTML="";
  CORE.forEach(p=>container.insertAdjacentHTML("beforeend",cardHTML(p,false)));
  extras.forEach(id=>container.insertAdjacentHTML("beforeend",cardHTML(findP(id),true)));
  restoreInto(container,data||{});
  container.querySelectorAll(".card").forEach(c=>{
    c.querySelectorAll("input,textarea").forEach(el=>{
      el.addEventListener("input",()=>{updateCard(c);update();save();});
      el.addEventListener("change",()=>{updateCard(c);update();save();});
    });
    updateCard(c);
  });
  renderChips(); update();
}
function updateCard(card){
  const st=card.querySelector('input[type=radio]:checked'); const val=st?st.value:null;
  card.querySelectorAll(".fields").forEach(f=>f.classList.toggle("show",f.dataset.for===val));
  let done=val==="keins"||val==="einladung"||val==="unbekannt";
  if(val==="login") done=!!(card.querySelector('[data-key$=".user"]').value.trim()&&card.querySelector('[data-key$=".pass"]').value.trim());
  card.classList.toggle("done",done);
  const pf=card.querySelector('[data-key$=".plattform"]');
  if(pf) card.querySelector(".pname").textContent=pf.value.trim()||t("custom");
}
function update(){
  const cards=[...container.querySelectorAll(".card")]; const d=cards.filter(c=>c.classList.contains("done")).length;
  document.getElementById("barFill").style.width=(cards.length?d/cards.length*100:0)+"%";
  document.getElementById("ptext").textContent=t("progress")(d,cards.length);
}
function renderChips(){
  document.getElementById("chips").innerHTML=OPTIONAL.map(o=>`<button class="chip" type="button" ${extras.includes(o.id)?"disabled":""} onclick="addOptional('${o.id}')">${o.icon} ${esc(o[LANG].name)}</button>`).join("");
}
function addOptional(id){ if(extras.includes(id))return; const d=collect(); extras.push(id); renderCards(d); save(); scrollToCard(id); }
function addCustom(){ const id="custom"+Date.now(); const d=collect(); d[id+".status"]="login"; extras.push(id); renderCards(d); save(); scrollToCard(id); }
function scrollToCard(id){ const c=container.querySelector(`[data-platform="${id}"]`); if(c) c.scrollIntoView({behavior:"smooth",block:"center"}); }
function removeCard(id){ if(!confirm(t("removeQ")))return; const d=collect(); extras=extras.filter(x=>x!==id); renderCards(d); save(); }
function togglePw(btn){ const i=btn.previousElementSibling; const s=i.type==="password"; i.type=s?"text":"password"; btn.textContent=s?t("hide"):t("show"); }

// ---------- Sprache ----------
function applyLang(){
  document.documentElement.lang=LANG==="de"?"de-CH":"en";
  document.title=LANG==="de"?"Zugangsdaten – Visiup":"Access details – Visiup";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML=t(el.dataset.t); });
  document.querySelectorAll("[data-tp]").forEach(el=>{ el.placeholder=t(el.dataset.tp); });
  document.querySelectorAll("[data-langswitch]").forEach(w=>{
    w.innerHTML=`<button type="button" class="${LANG==="de"?"active":""}" onclick="setLang('de')">DE</button><button type="button" class="${LANG==="en"?"active":""}" onclick="setLang('en')">EN</button>`;
  });
  document.querySelectorAll(".err-msg").forEach(m=>m.remove());
  document.querySelectorAll(".invalid").forEach(e=>e.classList.remove("invalid"));
  document.getElementById("errBanner").classList.remove("show");
}
function setLang(l){ const d=collect(); LANG=l; applyLang(); renderCards(d); save(); }

// ---------- Einverständnis ----------
document.getElementById("agree").addEventListener("change",e=>{ document.getElementById("gateBtn").disabled=!e.target.checked; });
function acceptGate(){
  if(!document.getElementById("agree").checked) return;
  consentAt=new Date().toISOString(); save();
  document.getElementById("gate").classList.add("hide");
  window.scrollTo(0,0);
}

// ---------- Speichern (nur lokal im Browser) ----------
function collect(){
  const data={}; document.querySelectorAll("main [data-key]").forEach(el=>{
    if(el.type==="radio"){ if(el.checked) data[el.dataset.key]=el.value; }
    else if(el.value) data[el.dataset.key]=el.value;
  }); return data;
}
function restoreInto(root,data){
  root.querySelectorAll("[data-key]").forEach(el=>{
    const v=data[el.dataset.key]; if(v===undefined) return;
    if(el.type==="radio") el.checked=(el.value===v); else el.value=v;
  });
}
function save(){ try{ localStorage.setItem(STORE,JSON.stringify({data:collect(),extras,lang:LANG,consentAt})); }catch(e){} }
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(STORE)); }catch(e){}
  if(s){ extras=s.extras||[]; LANG=s.lang||"de"; consentAt=s.consentAt||null; }
  else if((navigator.language||"").toLowerCase().startsWith("en")) LANG="en";
  applyLang(); renderCards(s?s.data:{});
  restoreInto(document.querySelector("main"),s?s.data:{});
  document.querySelectorAll("main > .card:not(#platforms .card) [data-key]").forEach(el=>el.addEventListener("input",save));
  if(consentAt) document.getElementById("gate").classList.add("hide");
}

// ---------- Text für Visiup (immer auf Deutsch) ----------
function buildText(){
  const d=collect(); const L=[];
  const STAT={login:"Login-Daten",einladung:"Einladung erteilt",unbekannt:"Weiss ich nicht",keins:"Nicht vorhanden"};
  L.push("ZUGANGSDATEN FÜR VISIUP","=======================");
  L.push("Firma: "+(d.firma||"-"),"Ansprechperson: "+(d.person||"-"),"E-Mail: "+(d.email||"-"),"Telefon: "+(d.telefon||"-"),"Website: "+(d.website||"-"));
  L.push("Sprache des Kunden: "+(LANG==="de"?"Deutsch":"Englisch"));
  L.push("Einverständnis (Betreuung + Login-Daten): JA, bestätigt am "+(consentAt?new Date(consentAt).toLocaleString("de-CH"):"-"),"");
  container.querySelectorAll(".card").forEach(c=>{
    const id=c.dataset.platform; const p=findP(id); const st=d[id+".status"];
    const name=p.custom?(d[id+".plattform"]||"Eigener Zugang"):p.de.name;
    L.push("--- "+name.toUpperCase()+" ---","Status: "+(STAT[st]||"nicht ausgefüllt"));
    c.querySelectorAll(`.fields[data-for='${st}'] [data-key]`).forEach(el=>{
      const v=d[el.dataset.key]; if(!v||el.dataset.key.endsWith(".plattform")) return;
      const wrap=el.closest(".grid > div")||el.closest(".fields"); const lab=wrap.querySelector("label");
      L.push((lab?(lab.dataset.l||lab.textContent).replace(" *",""):el.dataset.key)+": "+v);
    });
    L.push("");
  });
  if(d.bemerkungen) L.push("BEMERKUNGEN:",d.bemerkungen);
  return L.join("\n");
}

// ---------- Pflichtfelder ----------
function markErr(el,msg){
  el.classList.add("invalid");
  if(!el.parentElement.querySelector(":scope > .err-msg")){ const m=document.createElement("div"); m.className="err-msg"; m.textContent="⚠ "+msg; el.parentElement.appendChild(m); }
  el.addEventListener("input",()=>{ el.classList.remove("invalid"); const m=el.parentElement.querySelector(":scope > .err-msg"); if(m) m.remove(); refreshBanner(); },{once:true});
}
function refreshBanner(){
  const n=document.querySelectorAll(".invalid").length; const b=document.getElementById("errBanner");
  if(!n){ b.classList.remove("show"); return; } b.textContent=t("errBanner")(n); b.classList.add("show");
}
function check(){
  document.querySelectorAll(".err-msg").forEach(m=>m.remove()); document.querySelectorAll(".invalid").forEach(e=>e.classList.remove("invalid"));
  const f=[];
  [["firma","errFirma"],["person","errPerson"]].forEach(([id,k])=>{ const el=document.getElementById(id); if(!el.value.trim()){ markErr(el,t(k)); f.push(el); } });
  container.querySelectorAll('[data-key$=".plattform"]').forEach(el=>{
    if(el.closest(".card").querySelector('input[value=login]:checked')&&!el.value.trim()){ markErr(el,t("errPlat")); f.push(el); }
  });
  refreshBanner();
  if(f.length){
    f[0].scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>{ try{f[0].focus({preventScroll:true});}catch(e){} f[0].classList.add("shake"); setTimeout(()=>f[0].classList.remove("shake"),700); },450);
    toast(t("errToast")); return false;
  }
  if(!consentAt){ document.getElementById("gate").classList.remove("hide"); return false; }
  return true;
}

// ---------- Versand: kommt automatisch in info@visiup.ch an ----------
const SEND_URL="https://formsubmit.co/ajax/"+AGENTUR_EMAIL;
async function submitForm(){
  if(!check()) return;
  const btn=document.getElementById("sendBtn"); btn.disabled=true; btn.textContent=t("sending");
  const d=collect();
  try{
    const r=await fetch(SEND_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({_subject:"Zugangsdaten – "+(d.firma||""),_template:"box",_captcha:"false",
        _honey:document.getElementById("website_hp").value,_replyto:d.email||"",
        Firma:d.firma||"",Ansprechperson:d.person||"",Telefon:d.telefon||"",
        Einverstaendnis:"Ja – "+(consentAt?new Date(consentAt).toLocaleString("de-CH"):""),
        Zugangsdaten:buildText()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||String(j.success)!=="true") throw new Error(j.message||("HTTP "+r.status));
    try{ localStorage.removeItem(STORE); }catch(e){}
    document.getElementById("doneModal").classList.add("show");
  }catch(e){
    alert(/activ/i.test(e.message)?t("errActivate"):t("errSend")(e.message));
  }finally{ btn.disabled=false; btn.textContent=t("send"); }
}
function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2400); }

load();
</script>
